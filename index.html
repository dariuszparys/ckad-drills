<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CKAD drills</title>
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { const t = localStorage.getItem("ckad-drills-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<aside id="sidebar">
  <header class="brand">
    <div>
      <h1>CKAD drills</h1>
      <div id="overall" class="muted"></div>
    </div>
    <div class="brand-btns">
      <button id="theme-toggle" class="theme-btn" type="button"></button>
      <button id="mode-toggle" class="theme-btn" type="button"></button>
    </div>
  </header>
  <nav id="nav"></nav>
  <footer class="side-foot">
    <button class="reset-btn" data-reset="all">↺ Reset all progress</button>
  </footer>
</aside>
<main id="main"></main>
<script src="app/data.js"></script>
<script src="app/app.js"></script>
</body>
</html>
